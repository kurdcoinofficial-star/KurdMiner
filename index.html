<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <title>Kurd Miner</title>
    <style>
        body { background: #000; color: #ffd700; text-align: center; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .coin { width: 150px; height: 150px; background: gold; border-radius: 50%; margin: 20px; cursor: pointer; box-shadow: 0 0 20px #ffd700; }
    </style>
</head>
<body>
    <h1>کۆین: <span id="balance">0</span></h1>
    <button onclick="completeTask()" style="padding: 15px; font-size: 16px; background: #ffd700; border-radius: 10px; border: none; cursor: pointer;">ئەرک: سەردانی کەناڵ (10 کۆین)</button>
    <div class="coin" onclick="mine()"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyC7o8_t_b-x8U8E9N9J9H8Q8S8R8T8Q8P8", authDomain: "android-kurdistan.firebaseapp.com", databaseURL: "https://android-kurdistan-default-rtdb.firebaseio.com", projectId: "android-kurdistan", storageBucket: "android-kurdistan.appspot.com", messagingSenderId: "945532299105", appId: "1:945532299105:web:d259c6298539e6a9f4c3a2" };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let tgUser = window.Telegram ? window.Telegram.WebApp.initDataUnsafe.user : null;
        let userId = tgUser ? tgUser.id : "guest_123";

        // سیستەمی ڕێفەرال
        let startParam = window.Telegram.WebApp.initDataUnsafe.start_param;
        if (startParam) {
            database.ref('users/' + userId).once('value', (s) => {
                if (!s.val()) {
                    database.ref('users/' + userId).set({ score: 10 });
                    database.ref('users/' + startParam).once('value', (refUser) => {
                        let refScore = refUser.val() ? refUser.val().score : 0;
                        database.ref('users/' + startParam).update({ score: refScore + 5 });
                    });
                }
            });
        }

        database.ref('users/' + userId).on('value', (s) => {
            document.getElementById('balance').innerText = s.val() ? s.val().score : 0;
        });

        function mine() {
            let current = parseInt(document.getElementById('balance').innerText);
            database.ref('users/' + userId).set({ score: current + 1 });
        }

        function completeTask() {
            window.open("https://t.me/NecherwanGhafour", "_blank");
            database.ref('users/' + userId).once('value', (s) => {
                let current = s.val() ? s.val().score : 0;
                database.ref('users/' + userId).update({ score: current + 10 });
            });
        }
    </script>
</body>
</html>
